<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>VLC Player - البث الحصري</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: #0a0a0a;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            max-width: 520px;
            width: 100%;
            background: #1a1a1a;
            border-radius: 48px;
            padding: 40px 30px;
            text-align: center;
            box-shadow: 0 25px 40px rgba(0,0,0,0.6);
            border: 1px solid #333;
        }
        h1 {
            font-size: 32px;
            background: linear-gradient(135deg, #ffaa33, #ff6600);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            margin-bottom: 10px;
        }
        .sub {
            color: #aaa;
            font-size: 14px;
            margin-bottom: 30px;
        }
        .btn-play {
            background: #ff8800;
            border: none;
            border-radius: 60px;
            padding: 18px 20px;
            width: 100%;
            font-size: 24px;
            font-weight: bold;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            cursor: pointer;
            transition: 0.2s;
            box-shadow: 0 8px 20px rgba(255,136,0,0.4);
            margin: 25px 0 20px;
        }
        .btn-play:active {
            transform: scale(0.97);
            background: #e07a00;
        }
        .info {
            background: #252525;
            border-radius: 24px;
            padding: 18px;
            text-align: right;
            border-right: 4px solid #ff8800;
        }
        .info p {
            color: #ccc;
            font-size: 14px;
            margin: 8px 0;
        }
        .footer {
            font-size: 11px;
            color: #555;
            margin-top: 30px;
        }
    </style>
</head>
<body>
<div class="container">
    <h1>🎬 VLC Player</h1>
    <div class="sub">المشغل الوحيد المدعوم</div>
    <button id="playBtn" class="btn-play">
        <span>▶</span> تشغيل البث مباشرة
    </button>
    <div class="info">
        <p>🔒 <strong>آلية آمنة:</strong> الرابط مشفر ولا يمكن تشغيله في أي متصفح.</p>
        <p>📱 إذا كان <strong>VLC غير مثبت</strong>، سيتم توجيهك إلى Google Play لتحميله.</p>
        <p>⚠️ لن يعمل البث داخل المتصفح أبداً.</p>
    </div>
    <div class="footer">Android فقط | يتطلب VLC Player</div>
</div>

<script>
    (function() {
        // الرابط السري - لا يظهر في HTML
        const STREAM_URL = "https://raw.githubusercontent.com/abomas/iptv-files/refs/heads/main/chann1.m3u";
        const PLAY_STORE_URL = "https://play.google.com/store/apps/details?id=org.videolan.vlc&hl=ar";
        
        const playButton = document.getElementById("playBtn");
        
        function buildIntent() {
            // نزيل https:// من رابط البث ليكون مسار intent صحيح
            const hostAndPath = STREAM_URL.replace(/^https?:\/\//, '');
            const fallback = encodeURIComponent(PLAY_STORE_URL);
            return `intent://${hostAndPath}#Intent;scheme=https;package=org.videolan.vlc;S.browser_fallback_url=${fallback};end;`;
        }
        
        function openStream() {
            const intentUrl = buildIntent();
            
            // استخدم iframe مخفي بدلاً من تغيير عنوان الصفحة
            const iframe = document.createElement('iframe');
            iframe.style.display = 'none';
            iframe.src = intentUrl;
            document.body.appendChild(iframe);
            
            // مؤقت احتياطي: إذا لم يتم فتح التطبيق خلال 1.5 ثانية نرسل المتجر
            const fallbackTimer = setTimeout(function() {
                window.location.href = PLAY_STORE_URL;
            }, 1500);
            
            // إذا فُتح التطبيق وغادرت الصفحة التركيز، نلغي المؤقت
            window.addEventListener("blur", function cancelTimer() {
                clearTimeout(fallbackTimer);
                window.removeEventListener("blur", cancelTimer);
            });
            
            // تنظيف: نزيل الـ iframe بعد فترة قصيرة
            setTimeout(function() {
                if (iframe.parentNode) {
                    iframe.parentNode.removeChild(iframe);
                }
            }, 2000);
        }
        
        playButton.addEventListener("click", openStream);
        
        // منع النقر بزر الفأرة الأيمن واختصارات التصفح
        document.addEventListener("contextmenu", (e) => e.preventDefault());
        document.addEventListener("keydown", (e) => {
            if (e.key === "F12" || (e.ctrlKey && e.shiftKey && e.key === "I") || 
                (e.ctrlKey && (e.key === "u" || e.key === "U"))) {
                e.preventDefault();
            }
        });
    })();
</script>
</body>
</html>
