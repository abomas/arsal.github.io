<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VLC المشغل الحصري</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #0a0a0a;
            font-family: 'Segoe UI', system-ui, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        .card {
            max-width: 500px;
            width: 100%;
            background: #1a1a1a;
            border-radius: 40px;
            padding: 40px 30px;
            text-align: center;
            box-shadow: 0 20px 35px rgba(0,0,0,0.6);
            border: 1px solid #333;
        }
        .icon { font-size: 70px; margin-bottom: 15px; }
        h1 { font-size: 28px; color: #ff8800; margin-bottom: 8px; }
        p { color: #aaa; margin-bottom: 30px; line-height: 1.5; }
        .btn {
            background: #ff8800;
            border: none;
            border-radius: 60px;
            padding: 16px 25px;
            font-size: 22px;
            font-weight: bold;
            color: white;
            width: 100%;
            cursor: pointer;
            transition: 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            margin: 20px 0;
        }
        .btn:active { transform: scale(0.97); background: #e07a00; }
        .warning {
            background: #2a1e00;
            border-radius: 20px;
            padding: 15px;
            font-size: 14px;
            color: #ffcc88;
            border-right: 3px solid #ffaa33;
            text-align: right;
        }
        .footer { margin-top: 30px; font-size: 11px; color: #555; }
    </style>
</head>
<body>
<div class="card">
    <div class="icon">📺</div>
    <h1>VLC المشغل الوحيد</h1>
    <p>هذا البث لا يمكن تشغيله إلا عبر تطبيق VLC Player</p>
    
    <button id="playBtn" class="btn">
        ▶ تشغيل الآن في VLC
    </button>
    
    <div class="warning">
        ⚠️ إذا لم يكن VLC مثبتاً، سيتم تحويلك إلى Google Play لتحميله.<br>
        لن يعمل البث في أي متصفح أبداً.
    </div>
    <div class="footer">Android only | VLC Player مطلوب</div>
</div>

<script>
    (function() {
        const STREAM_URL = "https://stream.hls123.uk/live/ch3/index.m3u8";
        const PLAY_STORE = "https://play.google.com/store/apps/details?id=org.videolan.vlc";

        const btn = document.getElementById("playBtn");

        function openWithVlc() {
            // نستخدم بروتوكول vlc:// بدلاً من intent://
            // هذا البروتوكول لا يفهمه المتصفح أبداً ولا يمكنه تشغيل البث داخله
            const vlcLink = `vlc://${STREAM_URL}`;
            
            // محاولة فتح الرابط
            window.location.href = vlcLink;
            
            // إذا كان VLC غير مثبت، المتصفح لن يجد تطبيقاً للبروتوكول vlc://
            // وفي الغالب لن يحدث شيء، لذلك نحدد مهلة 1.5 ثانية ثم نوجه إلى Google Play
            const fallbackTimer = setTimeout(() => {
                window.location.href = PLAY_STORE;
            }, 1500);
            
            // إذا نجح فتح VLC (أي أن الصفحة انتقلت إلى التطبيق)، نلغي المهلة
            window.addEventListener("blur", () => {
                clearTimeout(fallbackTimer);
            });
            
            // أيضاً إذا عادت الصفحة (في حال فشل)، نلغي المهلة لمنع التداخل
            window.addEventListener("focus", () => {
                clearTimeout(fallbackTimer);
            });
        }
        
        btn.addEventListener("click", openWithVlc);
        
        // منع النقر بزر الفأرة الأيمن وبعض الاختصارات
        document.addEventListener("contextmenu", e => e.preventDefault());
        document.addEventListener("keydown", e => {
            if (e.key === "F12" || (e.ctrlKey && e.shiftKey && e.key === "I") || (e.ctrlKey && e.key === "u")) {
                e.preventDefault();
            }
        });
    })();
</script>
</body>
</html>
