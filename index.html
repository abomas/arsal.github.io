<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>VLC Player – Exclusive Stream</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: #0a0a0a;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            max-width: 520px;
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 24px;
        }
        .card {
            width: 260px;
            aspect-ratio: 1 / 1;
            background: #1a1a1a;
            border-radius: 40px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 16px;
            box-shadow: 0 20px 32px rgba(0,0,0,0.6);
            border: 1px solid #333;
            padding: 20px;
            transition: transform 0.2s;
        }
        .card:active {
            transform: scale(0.98);
        }
        .icon {
            width: 64px;
            height: 64px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .card h2 {
            font-size: 20px;
            font-weight: 700;
            color: #fff;
            text-align: center;
            margin: 0;
        }
        .card p {
            color: #aaa;
            font-size: 13px;
            text-align: center;
            margin: 0;
        }
        .btn {
            border: none;
            border-radius: 60px;
            padding: 14px 24px;
            font-size: 16px;
            font-weight: bold;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            cursor: pointer;
            transition: 0.2s;
            text-decoration: none;
            background: #ff8800;
            box-shadow: 0 8px 20px rgba(255,136,0,0.4);
            width: 100%;
        }
        .btn:active {
            background: #e07a00;
            transform: scale(0.97);
        }
        .btn-download {
            background: #2196F3;
            box-shadow: 0 8px 20px rgba(33,150,243,0.4);
        }
        .btn-download:active {
            background: #1976D2;
        }
        .secure-note {
            color: #888;
            font-size: 11px;
            text-align: center;
            margin-top: 8px;
        }
    </style>
</head>
<body>
<div class="container">
    <!-- Card 1: Download VLC Player -->
    <div class="card">
        <div class="icon">
            <!-- Simple VLC cone SVG -->
            <svg width="64" height="64" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
                <path d="M32 4L8 48H24L32 56L40 48H56L32 4Z" fill="#FF8800"/>
                <rect x="14" y="44" width="36" height="6" rx="3" fill="#FF8800"/>
                <rect x="26" y="28" width="12" height="10" rx="2" fill="white"/>
            </svg>
        </div>
        <h2>Get VLC Player</h2>
        <p>VLC is required to play the stream. Install it first.</p>
        <!-- Button opens Play Store -->
        <a id="downloadBtn" class="btn btn-download" href="#" target="_blank" rel="noopener">
            <span>📥</span> Download
        </a>
    </div>

    <!-- Card 2: Play the stream -->
    <div class="card">
        <div class="icon">
            <!-- Play triangle SVG -->
            <svg width="64" height="64" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
                <circle cx="32" cy="32" r="30" stroke="#FF8800" stroke-width="4" fill="none"/>
                <polygon points="24,18 24,46 48,32" fill="#FF8800"/>
            </svg>
        </div>
        <h2>Live Channel</h2>
        <p>Tap to launch VLC and start watching.</p>
        <button id="playBtn" class="btn">
            <span>▶</span> Play Stream
        </button>
    </div>
    <div class="secure-note">
        Secure link – only works with VLC on Android
    </div>
</div>

<script>
    (function() {
        // Hidden stream & store URLs – do not touch
        const STREAM_URL = "https://raw.githubusercontent.com/abomas/iptv-files/refs/heads/main/chann1.m3u";
        const PLAY_STORE_URL = "https://play.google.com/store/apps/details?id=org.videolan.vlc&hl=en";
        
        // Set download button href
        document.getElementById('downloadBtn').href = PLAY_STORE_URL;
        
        const playButton = document.getElementById("playBtn");
        
        function buildIntent() {
            const hostAndPath = STREAM_URL.replace(/^https?:\/\//, '');
            const fallback = encodeURIComponent(PLAY_STORE_URL);
            return `intent://${hostAndPath}#Intent;scheme=https;package=org.videolan.vlc;S.browser_fallback_url=${fallback};end;`;
        }
        
        function openStream() {
            const intentUrl = buildIntent();
            const iframe = document.createElement('iframe');
            iframe.style.display = 'none';
            iframe.src = intentUrl;
            document.body.appendChild(iframe);
            
            const fallbackTimer = setTimeout(function() {
                window.location.href = PLAY_STORE_URL;
            }, 1500);
            
            window.addEventListener("blur", function cancelTimer() {
                clearTimeout(fallbackTimer);
                window.removeEventListener("blur", cancelTimer);
            });
            
            setTimeout(function() {
                if (iframe.parentNode) {
                    iframe.parentNode.removeChild(iframe);
                }
            }, 2000);
        }
        
        playButton.addEventListener("click", openStream);
        
        // Protection (no right-click, no dev tools)
        document.addEventListener("contextmenu", (e) => e.preventDefault());
        document.addEventListener("keydown", (e) => {
            if (e.key === "F12" || (e.ctrlKey && e.shiftKey && e.key === "I") || 
                (e.ctrlKey && (e.key === "u" || e.key === "U"))) {
                e.preventDefault();
            }
        });
    })();
</script>
</body>
</html>
